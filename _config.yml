# Site-owned configuration. Theme runtime is pinned in Gemfile.
title: Elijah Soba’s Logbook
first_name: Elijah
last_name: Soba
lang: en
description: A logbook of notes, experiments, and lessons from working in machine
  learning.
url: https://esoba.github.io
baseurl: ""
icon: plat.jpg
og_image: /assets/img/plat.jpg
serve_og_meta: true
serve_schema_org: false
email: esoba@umich.edu
github_username: esoba
linkedin_username: esoba
theme: al_folio_core
al_folio:
  api_version: 1
  style_engine: tailwind
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
plugins:
  - al_folio_core
  - al_folio_upgrade
  - al_math
  - jekyll-archives-v2
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2
permalink: /blog/:year/:title/
timezone: America/Los_Angeles
pagination:
  enabled: true
jekyll-archives:
  posts:
    enabled:
      - year
      - tags
      - categories
    layout: archive
    permalinks:
      year: /blog/:year/
      tags: /blog/tag/:name/
      categories: /blog/category/:name/
include:
  - _pages
exclude:
  - bin
  - docs
  - AGENTS.md
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - FAQ.md
  - INSTALL.md
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - al-folio-upgrade-report.md
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math: true
      section: logbook
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false
enable_math: true
enable_darkmode: true
third_party_libraries:
  mathjax:
    integrity:
      js: sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=
    local:
      fonts: output/chtml/fonts/woff-v2/
    url:
      fonts: https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/output/chtml/fonts/woff-v2/
      js: https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
    version: 3.2.2
